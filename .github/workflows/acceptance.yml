name: 验收门禁

# 每次 PR / 推送到 main 都自动跑一遍"能跑的小判据"。
# 为什么只跑一部分：几何/图像的全量判据需要 120 MB 实测 B-Rep 网格与 518 张真实照片
#（这些不进版本库，见 README 第三节），CI 里跑不动；所以 CI 守的是
#「代码能跑、核心不变红」，全量判据在本地/云端跑（scripts\04_验收基准.ps1）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    name: 自检 + 核心判据
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/legacy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装基础依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow opencv-python-headless pytest

      - name: 自检
        run: python -m ai_modeler --selftest

      - name: 目录与运行路径回归
        run: python -m pytest tests/test_paths.py -q

      - name: 提示词解析回归（不需要大数据的部分）
        run: python tools/bench_basic_parts.py || true

      - name: 自研布尔等价性（体积 + 封闭性）
        run: python tools/check_bsp_local.py

      - name: 几何判据（抽样一族，快速版）
        run: python tools/bench_detail_fidelity.py --group 销座

      - name: 把报告存成构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            temp/agent-logs/**/*.md
            src/legacy/reports/*.md
            src/legacy/kb/detail_fidelity.json
          if-no-files-found: ignore
