[package]
name = "ai-modeler-ui"
version = "0.1.0"
description = "Rust and Tauri desktop UI for AI Modeler"
authors = ["AI Modeler"]
license = "MIT"
repository = "https://github.com/Mary111222/AI-_-"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "ai-modeler"
path = "src/main.rs"

[lib]
name = "ai_modeler_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
