# Generated for this AI Modeler conversation. Do not edit the global DSH profile.
- id: llm-pi-ai
  config:
    providers:
      ai-modeler:
        displayName: AI Modeler
        apiKeyEnv: AIMODELER_LLM_API_KEY
        api: openai-completions
        baseURL: "https://api.siliconflow.cn/v1"
        retryPolicy:
          mode: normal
          maxRetries: 3
        models:
          - id: "moonshotai/Kimi-K2.7-Code"
            name: "moonshotai/Kimi-K2.7-Code"
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              off: null
              low: "enabled"
        defaultInput: [text, image]
        maxRequestImageBytes: 20971520
        requestImagePixelBudget: 64000000
        requestImageMaxBytes: 20971520
        compat:
          supportsDeveloperRole: false
          thinkingTokenBudgetField: "thinking_budget"
          thinkingFormat: "qwen"

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? ''
    personaSuffix: ''
